name: questopia_re
description: "Questopia Flutter client for QSP interactive fiction."
publish_to: 'none'

version: 3.25.5+202505

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_inappwebview: ^6.1.5
  file_picker: ^8.1.3
  permission_handler: ^11.3.1
  http: ^1.2.2
  ffi: ^2.1.3
  path: ^1.9.0
  audioplayers: ^6.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/ogv/
