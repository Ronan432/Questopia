plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
}

android {
    namespace 'org.qp.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.test.questopia"
        minSdk 26
        targetSdk 34
        versionCode 202505
        versionName "3.25.5"
        resourceConfigurations += ['en', 'ru', 'tr']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DBUILD_JAVA=1"
                cFlags "-DANDROID"
            }
        }
    }

    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file("keystore/github_keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_SIGN_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_SIGN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + System.currentTimeMillis() + "L)"
        }
        release {
            if (file("keystore/github_keystore").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + System.currentTimeMillis() + "L)"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    ndkVersion = '27.2.12479018'
    lint {
        abortOnError false
    }

}

dependencies {
    implementation libs.androidx.foundation.layout
    coreLibraryDesugaring(libs.desugar.jdk.libs)

    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.documentfile
    implementation libs.preference
    implementation libs.fragment
    implementation libs.webkit
    implementation libs.material
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.collection

    // Jetpack Compose & Material You (M3)
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.compose.runtime.livedata
    implementation libs.coil.compose
    debugImplementation libs.compose.ui.tooling

    implementation libs.jsoup
    implementation libs.storage
    implementation libs.libpickyou

    // KMP Core: Ktor, Kotlinx Serialization, Multiplatform Settings
    implementation libs.ktor.client.core
    implementation libs.ktor.client.okhttp
    implementation libs.kotlinx.serialization.json
    implementation libs.multiplatform.settings
    implementation libs.multiplatform.settings.no.arg

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}