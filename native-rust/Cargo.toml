[package]
name = "questopia_rust_core"
version = "0.1.0"
edition = "2021"
authors = ["Questopia Engineering Team"]
description = "High-performance Rust native engine core for Questopia (Fast HTML parser, Streaming Archive decompressor, Audio mixer)"

[lib]
name = "questopia_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
