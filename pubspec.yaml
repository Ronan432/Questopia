name: questopia_re
description: "Questopia Flutter client for QSP interactive fiction."
publish_to: 'none'

version: 3.25.5+202505

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_inappwebview: ^6.1.5
  file_picker: ^8.1.3
  filesystem_picker: ^4.1.0
  permission_handler: ^11.3.1
  http: ^1.2.2
  ffi: ^2.1.3
  path: ^1.9.0
  audioplayers: ^6.1.0
  archive: ^3.6.1
  xml: ^6.5.0
  package_info_plus: ^8.1.3
  dynamic_color: ^1.7.0
  gal: ^2.3.3
  url_launcher: ^6.3.1
  image: ^4.2.0
  http_parser: ^4.0.0
  background_downloader: ^9.5.9
  material_segmented_list: ^1.0.5
  split_pane: ^0.2.0
  material_3_expressive: ^1.0.9
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/ogv/
