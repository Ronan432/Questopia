name: Android build CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
        continue-on-error: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/*.apk build-artifacts/Questopia-Universal-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Questopia-Universal-release
          path: build-artifacts/Questopia-Universal-release.apk

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.25.5-pre${{ github.run_number }}
          name: "Questopia Pre-Release v3.25.5 (Build ${{ github.run_number }})"
          body: |
            ### Automated CI Pre-Release Build
            - Universal APK (supports ARM64, ARMv7, x86, x86_64)
            - Minimized & R8 optimized
            - Includes Cheat Modes & Save Editor integration
          draft: false
          prerelease: true
          files: build-artifacts/Questopia-Universal-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
